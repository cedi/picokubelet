[build]
target = "xtensa-esp32s3-none-elf"

[alias]
host-test = "test --target aarch64-apple-darwin --lib -Z build-std=std,panic_abort"
ci-host-test = "test --target x86_64-unknown-linux-gnu --lib -Z build-std=std,panic_abort"

[target.xtensa-esp32s3-none-elf]
runner = "espflash flash --monitor --partition-table partitions.csv"
rustflags = [
  # esp-hal provides the linker scripts.
  "-C", "link-arg=-nostartfiles",
  "-C", "link-arg=-Tlinkall.x",
  # Make the embassy-executor stack happy on Xtensa.
  "-C", "link-arg=-Wl,--no-eh-frame-hdr",
]

[unstable]
build-std = ["alloc", "core"]

[env]
# Used by esp-println / esp-backtrace for nicer logs, and by us for k3s creds
# (loaded from .env via mise).
ESP_LOG = "info"
