[package]
name = "picokubelet"
version = "0.1.0"
edition = "2024"
authors = ["Cedric Specht <cedric@specht-labs.de>"]
description = "An ESP32-S3 that registers itself as a Kubernetes worker node. Glorious nonsense, real implementation."
license = "MIT OR Apache-2.0"
repository = "https://github.com/cedi/picokubelet"
publish = false

[[bin]]
name = "picokubelet"
path = "src/main.rs"

[dependencies]
embassy-time = { version = "0.5" }
# Xtensa LX7 doesn't have native u64 atomics; portable-atomic emulates them
# via critical sections (already provided by esp-hal).
portable-atomic = { version = "1", default-features = false, features = ["critical-section"] }

# --- Utility ---
heapless = "0.8"
log = "0.4"

[target.'cfg(target_arch = "xtensa")'.dependencies]
# --- Core esp-rs stack ---
esp-hal = { version = "1.1", features = ["esp32s3", "unstable"] }
# esp-rtos is the successor to esp-hal-embassy; provides the embassy
# executor + time driver hooked into esp-hal timers.
# DO NOT enable embassy-executor's arch-* features alongside this.
esp-rtos = { version = "0.3", features = ["esp32s3", "embassy", "esp-radio", "log-04"] }
esp-radio = { version = "0.18", features = ["esp32s3", "wifi", "unstable"] }
esp-alloc = { version = "0.10" }
esp-backtrace = { version = "0.19", features = ["esp32s3", "panic-handler", "println"] }
esp-bootloader-esp-idf = { version = "0.5", features = ["esp32s3"] }
esp-println = { version = "0.17", default-features = false, features = ["esp32s3", "log-04", "uart"] }

# --- Embassy ---
embassy-executor = { version = "0.10" }
embassy-sync = { version = "0.8" }
embassy-net = { version = "0.9", features = [
    "dhcpv4",
    "medium-ethernet",
    "proto-ipv4",
    "tcp",
    "dns",
] }
embassy-futures = { version = "0.1" }
embassy-embedded-hal = { version = "0.6", features = ["time"] }
embassy-net-wiznet = { version = "0.3" }
embedded-hal-async = "1"

# --- TLS ---
# embedded-tls (TLS 1.3 only) used directly — no reqwless. The published
# reqwless 0.14 hardcodes embedded-tls's `rustpki` feature on, which pulls
# der-0.8 in a configuration that fails to compile. We don't need cert
# parsing yet (verification is off for the home-lab dev loop), so we drop
# both rustpki and webpki and assemble HTTP requests by hand on top of a
# raw TLS stream. When we switch to real CA verification we'll move to
# esp-rs/mbedtls-rs (proper SAN + hardware crypto), which is a larger
# integration — Trng/SHA/RSA peripherals + RTC + matching esp-hal git rev.
embedded-tls = { version = "0.18", default-features = false, features = ["log"] }
embedded-io-async = { version = "0.7", default-features = false }
rand_core = { version = "0.6", default-features = false }
rand_chacha = { version = "0.3", default-features = false }

# --- Utility ---
static_cell = "2.1"

[profile.release]
codegen-units = 1
debug = 2          # symbols stay in .elf, stripped from binary by espflash
debug-assertions = false
incremental = false
lto = "fat"
opt-level = "s"    # size-optimize; flash is 16MB but link time matters
overflow-checks = false

[profile.dev]
debug = 2
opt-level = "s"
overflow-checks = true
lto = "off"

# embassy-executor 0.10 reads task-arena size from this metadata block.
[package.metadata.embassy-executor]
task-arena-size = 65536
